quarkus.http.port=8080

# Root directory where game ateliers are persisted (research.md R-002)
cornucopai.ateliers.root-dir=ateliers

# Root of the Cornucopia repo, provided through the CORNUCOPIA_HOME env var (spec 003, R-012).
# Empty means "not configured" -> empty card catalog, launching a game is refused (FR-011).
cornucopai.cornucopia-home=${CORNUCOPIA_HOME:}

# LLM defaults for player agents (spec 004, R-028). Default provider is the local bionic
# server, OpenAI-compatible, WITHOUT authentication (FR-002) to keep costs at zero.
# Per-agent overrides come through the optional `agents` array of POST /api/ateliers.
cornucopai.llm.base-url=${LLM_BASE_URL:http://localhost:1235/v1}
cornucopai.llm.api-key=${LLM_API_KEY:}
cornucopai.llm.model=${LLM_MODEL:}
cornucopai.llm.timeout-seconds=${LLM_TIMEOUT_SECONDS:120}
# Brain implementation: "auto" (real LLM per agent config) or "fake" (scripted test double,
# used by the test profile so CI never calls a real LLM — spec 004 R-031).
cornucopai.llm.brain=${LLM_BRAIN:auto}

# Debug mode (constitution v1.3.0 — must always stay available):
#   MAVEN_OPTS="-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005" ./mvnw quarkus:dev
# then attach an IDE debugger to localhost:5005
