quarkus.http.port=8080

# Root directory where game ateliers are persisted (research.md R-002)
cornucopai.ateliers.root-dir=ateliers

# Root of the Cornucopia repo, provided through the CORNUCOPIA_HOME env var (spec 003, R-012).
# Empty means "not configured" -> empty card catalog, launching a game is refused (FR-011).
cornucopai.cornucopia-home=${CORNUCOPIA_HOME:}

# LLM defaults for player agents (spec 004, R-028). Default provider is the local bionic
# server, OpenAI-compatible, WITHOUT authentication (FR-002) to keep costs at zero.
# Per-agent overrides come through the optional `agents` array of POST /api/ateliers.
cornucopai.llm.base-url=${LLM_BASE_URL:http://localhost:1235/v1}
cornucopai.llm.api-key=${LLM_API_KEY:}
cornucopai.llm.model=${LLM_MODEL:}
cornucopai.llm.timeout-seconds=${LLM_TIMEOUT_SECONDS:180}
# Brain implementation: "auto" (real LLM per agent config) or "fake" (scripted test double,
# used by the test profile so CI never calls a real LLM — spec 004 R-031).
cornucopai.llm.brain=${LLM_BRAIN:auto}

# Spec 007 (R-048, FR-001/FR-002/FR-014): IDE MCP server (streamable HTTP, no auth for
# now — the server serves the project open in the user's IDE; clarification 2026-11-11:
# CornucopAI does NOT configure a project path). Tool whitelist = FR-002.
cornucopai.mcp.ide.enabled=${MCP_IDE_ENABLED:true}
cornucopai.mcp.ide.url=${MCP_IDE_URL:http://127.0.0.1:64462/stream}
cornucopai.mcp.ide.tools=${MCP_IDE_TOOLS:get_project_dependencies,get_project_modules,list_directory_tree,read_file,search_file,search_regex,search_text}
cornucopai.mcp.ide.timeout-seconds=${MCP_IDE_TIMEOUT_SECONDS:30}
# test profile sets this to true so CI uses the in-memory MockMcpClient (R-055, FR-015)
cornucopai.mcp.ide.mock=${MCP_IDE_MOCK:false}
# Pin the MCP protocol version to skip auto-detection (some servers reject the probe).
# Example: cornucopai.mcp.ide.protocol-version=2025-11-25  (empty/absent = auto-detect)
# NOTE: do not set an empty value here — SmallRye converts "" to null and fails String binding.
# Background health-check/reconnection loop of the MCP client — default FALSE: when the
# IDE server is down we do NOT want a WARN reconnection attempt spamming the logs.
cornucopai.mcp.ide.auto-health-check=${MCP_IDE_AUTO_HEALTH_CHECK:false}
# Spec 007 (FR-013): bounded debate before each vote — OFF by default since 2026-11-11
# (observed: a hypothetical "si le champ était un string..." answer convinced voters without
# any factual check of the project; the decision-tree vote with MCP verification is the reliable path)
cornucopai.debate.enabled=${DEBATE_ENABLED:false}
# Spec 007 (FR-008, clarification 2026-11-11): how many recent project facts are injected in prompts
cornucopai.memory.prompt-window=${MEMORY_PROMPT_WINDOW:20}
cornucopai.mcp.ide.protocol-version=2025-11-25
