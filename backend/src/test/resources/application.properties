# Test configuration: ateliers are persisted under target/ so tests never touch real data
cornucopai.ateliers.root-dir=target/test-ateliers

# Point the card catalog at the hermetic fixture (spec 003, R-020)
cornucopai.cornucopia-home=src/test/resources/cornucopia-fixture

# Spec 004 (R-031): CI never calls a real LLM — all game tests run on the scripted
# FakeLlmBrain. Any new game test MUST also select exactly ONE card family (FR-014).
cornucopai.llm.brain=fake

# Spec 007 (R-055, FR-015): CI never opens a real MCP connection — use the in-memory
# MockMcpClient listing the whitelisted tools.
cornucopai.mcp.ide.mock=true
