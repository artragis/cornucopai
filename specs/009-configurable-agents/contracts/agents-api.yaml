# API contract for configurable agents — NEW in feature 009-configurable-agents (v1.0.0)
#
# CRUD for the JSON agent objects managed on the dedicated /agents page (spec 009, US-1,
# FR-001..FR-005). Each agent is stored server-side as one file agents/{id}.json
# (contracts/agent-schema.json, research R-001). An agent is ALWAYS LLM-backed: the
# apiKeyVar field stores only the NAME of the environment variable holding the API key;
# the key value itself is resolved server-side at game launch via System.getenv and is
# never persisted (FR-006/FR-013/FR-017).
#
# Validation (FR-019, research R-003):
#   - agentName, openAiCompatibleUrl, modelName, personalityPrompt: required, non-blank
#   - openAiCompatibleUrl: absolute http/https URL
#   - apiKeyVar: optional; if present must match ^[A-Za-z_][A-Za-z0-9_]*$ ; empty = no key
#   - agentName unique across all agents (FR-018) -> 409 on duplicate
#   - id: generated by the server (UUID) on POST, immutable on PUT (FR-003)
openapi: 3.0.3
info:
  title: CornucopAI Agents API
  version: 1.0.0
  description: >
    Create, list, update and delete configurable LLM agents (spec 009). Agents are
    selected by id when creating an atelier (see ateliers-api.yaml v0.8.0).
paths:
  /api/agents:
    get:
      summary: List all agents (spec 009 FR-001)
      operationId: listAgents
      responses:
        '200':
          description: All agents, sorted by agentName
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Agent'
    post:
      summary: Create an agent (FR-002, FR-003) — id is generated server-side
      operationId: createAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentInput'
            example:
              agentName: Analyste sécurité
              openAiCompatibleUrl: "http://localhost:1235/v1"
              apiKeyVar: ""
              modelName: "qwen3-coder"
              personalityPrompt: "Tu es un analyste sécurité tatillon qui challenge chaque hypothèse."
      responses:
        '201':
          description: Agent created; the generated id is returned in the body and Location header
          headers:
            Location:
              schema: { type: string }
              description: /api/agents/{id}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          description: Validation failed (FR-019) — message names the offending field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: agentName already used by another agent (FR-018)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/agents/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get one agent (FR-001)
      operationId: getAgent
      responses:
        '200':
          description: The agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '404':
          description: Unknown agent id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update an agent (FR-004) — id in path is authoritative and never changes (FR-003)
      operationId: updateAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentInput'
      responses:
        '200':
          description: Updated agent (same id)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          description: Validation failed, or body id differs from path id (FR-003/FR-019)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown agent id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: agentName already used by another agent (FR-018)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete an agent (FR-005) — existing ateliers keep their launch snapshot (FR-017)
      operationId: deleteAgent
      responses:
        '204':
          description: Agent deleted; no longer selectable for a new atelier
        '404':
          description: Unknown agent id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    AgentInput:
      type: object
      required: [agentName, openAiCompatibleUrl, modelName, personalityPrompt]
      properties:
        agentName:
          type: string
          minLength: 1
          description: Human-readable name, unique across agents (FR-018)
          example: Analyste sécurité
        openAiCompatibleUrl:
          type: string
          format: uri
          description: Absolute http/https URL of the LLM endpoint (local server, Mistral API, Azure Foundry…)
          example: "https://api.mistral.ai/v1"
        apiKeyVar:
          type: string
          pattern: '^$|^[A-Za-z_][A-Za-z0-9_]*$'
          description: Name of the env var holding the API key. Empty = the API needs no key. Only the NAME is stored, never the value (FR-006).
          example: MISTRAL_API_KEY
        modelName:
          type: string
          minLength: 1
          example: mistral-large-latest
        personalityPrompt:
          type: string
          minLength: 1
          description: Free-text personality + extra instructions, replaces the old archetype enum (FR-012)
          example: "Tu es un analyste sécurité tatillon qui challenge chaque hypothèse."
    Agent:
      allOf:
        - $ref: '#/components/schemas/AgentInput'
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
              description: Server-generated at creation, immutable (FR-003)
              readOnly: true
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: "openAiCompatibleUrl must be an absolute http/https URL"
