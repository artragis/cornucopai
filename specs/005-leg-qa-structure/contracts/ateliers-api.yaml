# API contract for ateliers — UPDATED by feature 005-leg-qa-structure
# (supersedes specs/004-llm-agents/contracts/ateliers-api.yaml v0.4.0)
# Changes (spec 004, FR-001/FR-002/FR-012/FR-015, research R-028/R-032):
#   - POST body gains an OPTIONAL `agents` array: per-player LLM provider config
#     (ACP provider like github-copilot/mistral-vibe, or OpenAI-compatible baseUrl +
#     optional apiKey + modelName). When absent, every player uses the server defaults
#     (cornucopai.llm.* — base URL defaults to http://localhost:1235/v1, no auth).
#   - Atelier gains `agentConfigs`: the resolved per-player AgentLlmConfig, persisted
#     and index-aligned with `players`.
#   - 400 gains: invalid agent config (unknown providerType/acpProvider, blank baseUrl
#     for OPENAI_COMPATIBLE, agents.length > playerCount).
# The game still runs synchronously on POST.
# Spec 005 (v0.5.0): the Leg schema changes — `precisions` (string array) is REPLACED by
# `entries` (array of structured LegEntry objects: kind/author/text/knows/answer) —
# see contracts/leg-schema.json v2.0.0 (breaking write change, legacy read tolerated).
# Everything else (agents[], agentConfigs) is unchanged from v0.4.0.
openapi: 3.0.3
info:
  title: CornucopAI Ateliers API
  version: 0.5.0
  description: >
    Create and run a Cornucopia threat-modeling workshop played by LLM-powered AI
    agents (spec 004). Each agent's LLM provider is configurable individually
    (ACP agent or OpenAI-compatible URL; default local server http://localhost:1235/v1,
    no auth). Real cards of the selected families (spec 003) are unchanged.
paths:
  /api/ateliers:
    post:
      summary: Configure and launch a game played by LLM agents (spec 004 FR-001..FR-004)
      operationId: createAtelier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAtelierRequest'
            example:
              playerCount: 4
              featureHtml: "<p>Analyse de la feature <b>login OAuth2</b></p>"
              language: fr
              families: ["webapp:VE"]
              agents:
                - name: Joueur-1
                  archetype: GRUMPY
                  providerType: OPENAI_COMPATIBLE
                  baseUrl: "http://localhost:1235/v1"
                  modelName: ""
                - name: Joueur-2
                  archetype: HAPPY
                  providerType: ACP
                  acpProvider: github-copilot
      responses:
        '201':
          description: Atelier created and game fully played by LLM agents; legs + agent configs persisted on disk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Atelier'
        '400':
          description: >
            Invalid request — playerCount < 2, empty featureHtml, empty families,
            unknown setId:familyId, Cornucopia repo not configured (spec 003), or
            invalid agent config (spec 004): unknown providerType/acpProvider, blank
            baseUrl for OPENAI_COMPATIBLE, agents.length > playerCount
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: List all ateliers (id, createdAt, playerCount)
      operationId: listAteliers
      responses:
        '200':
          description: List of atelier summaries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AtelierSummary'
  /api/ateliers/{id}:
    get:
      summary: Full atelier detail including every leg, its validation status, and the resolved agent LLM configs
      operationId: getAtelier
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          example: atelier2026-11-08-091500
      responses:
        '200':
          description: Atelier detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Atelier'
        '404':
          description: Unknown atelier id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    CreateAtelierRequest:
      type: object
      required: [playerCount, featureHtml, families]
      properties:
        playerCount:
          type: integer
          minimum: 2
          example: 4
        featureHtml:
          type: string
          minLength: 1
          example: "<p>Analyse de la feature <b>login OAuth2</b></p>"
        language:
          type: string
          default: fr
          description: Chosen language, lowercase; defaults to French (spec 003 FR-015). Falls back per set to "en".
          example: fr
        families:
          type: array
          minItems: 1
          description: Selected families as "setId:familyId" pairs (spec 003 FR-005). At least one required (FR-006).
          items: { type: string }
          example: ["webapp:VE"]
        agents:
          type: array
          description: >
            OPTIONAL per-player LLM provider configs (spec 004 FR-001). At most
            playerCount entries; entry i configures players[i]. When absent, all
            players use the server defaults (cornucopai.llm.*; base URL default
            http://localhost:1235/v1 without auth — FR-002).
          items:
            $ref: '#/components/schemas/AgentConfig'
    AgentConfig:
      type: object
      required: [providerType]
      properties:
        name:
          type: string
          description: Player name; defaults to Joueur-N
          example: Joueur-1
        archetype:
          $ref: '#/components/schemas/Archetype'
        providerType:
          type: string
          enum: [OPENAI_COMPATIBLE, ACP]
          description: Kind of LLM provider for this agent (FR-001)
        baseUrl:
          type: string
          description: OpenAI-compatible base URL — required when providerType=OPENAI_COMPATIBLE (blank → 400)
          example: "http://localhost:1235/v1"
        apiKey:
          type: string
          nullable: true
          description: Optional API key; absent/empty = no authentication (default)
        modelName:
          type: string
          nullable: true
          description: Model name sent to the endpoint; may be empty (server-dependent, R-028)
        acpProvider:
          type: string
          enum: [github-copilot, mistral-vibe]
          description: ACP agent to use — required when providerType=ACP
        command:
          type: string
          nullable: true
          description: Optional CLI override for the ACP provider (test seam, R-028)
    AgentLlmConfig:
      type: object
      description: Resolved per-player LLM config, persisted in atelier.json `agentConfigs` (FR-012)
      required: [providerType]
      properties:
        providerType:
          type: string
          enum: [OPENAI_COMPATIBLE, ACP]
        baseUrl:
          type: ["string", "null"]
          example: "http://localhost:1235/v1"
        apiKey:
          type: ["string", "null"]
        modelName:
          type: ["string", "null"]
        acpProvider:
          type: ["string", "null"]
          enum: [github-copilot, mistral-vibe, null]
        command:
          type: ["string", "null"]
    Card:
      type: object
      required: [id, value, setId, suitId, suitName, language, description]
      properties:
        id: { type: string, example: VE2 }
        value: { type: string, example: "2" }
        setId: { type: string, example: webapp }
        suitId: { type: string, example: VE }
        suitName: { type: string, example: "DATA VALIDATION & ENCODING" }
        language: { type: string, description: Resolved language of this card, example: fr }
        description: { type: string, example: "Robert can input malicious data because the allowed protocol format is not being checked…" }
        url: { type: string, nullable: true }
        misc: { type: string, nullable: true }
    SetResolution:
      type: object
      required: [id, resolvedLanguage]
      properties:
        id: { type: string, example: webapp }
        resolvedLanguage:
          type: string
          description: Language actually used for this set (chosen language, or "en" fallback)
          example: fr
    Archetype:
      type: string
      enum: [GRUMPY, HAPPY, GREEDY, PROF]
    ValidationStatus:
      type: string
      enum: [PENDING, VALIDATED, REJECTED]
    Participant:
      type: object
      required: [name, archetype]
      properties:
        name: { type: string, example: Joueur-1 }
        archetype: { $ref: '#/components/schemas/Archetype' }
    Leg:
      type: object
      description: The 5-field JSON persisted per played tour (contracts/leg-schema.json v2.0.0, spec 005). cardName is a REAL card id (e.g. VE2) referencing a Card in atelier.json's deck. `entries` (v2) replaces v1 `precisions` — array of LegEntry objects {kind, author, text, knows?, answer?}.
      required: [cardName, scenario, explanation, entries, validation]
      properties:
        cardName: { type: string, example: VE2 }
        scenario: { type: string, example: "Un attaquant injecte du HTML dans le champ commentaire" }
        explanation: { type: string }
        entries:
          type: array
          description: Structured turn entries — precisions and questions WITH their knows/answer (spec 005 FR-001)
          items: { $ref: '#/components/schemas/LegEntry' }
        validation: { $ref: '#/components/schemas/ValidationStatus' }
    LegEntry:
      type: object
      required: [kind, author, text]
      properties:
        kind: { type: string, enum: [PRECISION, QUESTION] }
        author: { type: string, example: Joueur-1 }
        text: { type: string, minLength: 1 }
        knows: { type: boolean, description: "QUESTION only — « Je sais » (true) / « Je sais pas » (false)" }
        answer: { type: string, description: "QUESTION only, present iff knows=true" }
    Atelier:
      type: object
      required: [id, createdAt, featureHtml, playerCount, players, turnOrder, language, selectedFamilies, deck, sets, agentConfigs, legs]
      properties:
        id: { type: string, example: atelier2026-11-08-091500 }
        createdAt: { type: string, format: date-time }
        featureHtml: { type: string }
        playerCount: { type: integer }
        players:
          type: array
          items: { $ref: '#/components/schemas/Participant' }
        turnOrder:
          type: array
          items: { type: string }
        language: { type: string, example: fr }
        selectedFamilies:
          type: array
          items: { type: string }
          example: ["webapp:VE"]
        deck:
          type: array
          description: Real dealt cards (full objects, id + description persisted here) — spec 003 R-016
          items: { $ref: '#/components/schemas/Card' }
        sets:
          type: array
          description: Resolved language per set used in this game
          items: { $ref: '#/components/schemas/SetResolution' }
        agentConfigs:
          type: array
          description: Resolved per-player LLM configs (spec 004 FR-012), index-aligned with `players`
          items: { $ref: '#/components/schemas/AgentLlmConfig' }
        legs:
          type: array
          items: { $ref: '#/components/schemas/Leg' }
    AtelierSummary:
      type: object
      required: [id, createdAt, playerCount]
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        playerCount: { type: integer }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, example: "invalid agent config: unknown providerType 'FOO'" }
