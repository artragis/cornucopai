# API contract for ateliers — UPDATED by feature 007-contextual-game-turns
# (supersedes specs/006-game-scoreboard/contracts/ateliers-api.yaml v0.6.0)
# Changes (spec 007, FR-007, research R-053/R-056):
#   - CreateAtelierRequest gains optional `inheritFactsFrom` (string, source atelier id).
#     When set and the source atelier has non-empty `projectFacts`, those facts are copied
#     into the new atelier's projectFacts at creation (FR-007, clarification 2026-11-11).
#   - AtelierSummary gains `hasProjectFacts` (boolean) so the frontend dropdown can list
#     only ateliers that actually have facts (R-056).
#   - Atelier schema gains `projectFacts` (array of ProjectFact) — additive, legacy = [].
#   - Leg schema gains `votes` (array of VoteDecision) — see leg-schema.json v4.0.0.
# Everything else (POST body, agents[], agentConfigs, GET list, GET by id) is unchanged from v0.6.0.
# The game still runs synchronously on POST.
openapi: 3.0.3
info:
  title: CornucopAI Ateliers API
  version: 0.7.0
  description: >
    Create and run a Cornucopia threat-modeling workshop played by LLM-powered AI
    agents. Spec 007 adds project-aware agents: MCP IDE tools in the agents' toolbox,
    a shared per-atelier project-fact memory (persisted, optionally inherited), and
    structured vote decisions with justifications.
paths:
  /api/ateliers:
    post:
      summary: Configure and launch a game (runs synchronously)
      operationId: createAtelier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAtelierRequest'
            example:
              playerCount: 4
              featureHtml: "<p>Analyse de la feature <b>login OAuth2</b></p>"
              language: fr
              families: ["webapp:VE"]
              inheritFactsFrom: atelier20261110-153022
      responses:
        '201':
          description: Atelier created, game fully played, persisted with projectFacts and per-leg votes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Atelier'
        '400':
          description: Invalid request (playerCount < 2, empty featureHtml, unknown families, invalid agent config, unknown inheritFactsFrom)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: List all ateliers (id, createdAt, playerCount, hasProjectFacts), newest first
      operationId: listAteliers
      responses:
        '200':
          description: List of atelier summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AtelierSummary'
  /api/ateliers/{id}:
    get:
      summary: Get one atelier with its legs, tours, scores, winner, projectFacts
      operationId: getAtelier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The atelier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Atelier'
        '404':
          description: Unknown atelier id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    CreateAtelierRequest:
      type: object
      required: [playerCount, featureHtml, families]
      properties:
        playerCount:
          type: integer
          minimum: 2
        featureHtml:
          type: string
          minLength: 1
        language:
          type: string
          default: fr
        families:
          type: array
          minItems: 1
          items:
            type: string
            description: "setId:familyId"
        agents:
          type: array
          description: Optional per-agent LLM provider configs (spec 004)
          items:
            type: object
        inheritFactsFrom:
          type: string
          description: Optional source atelier id; its projectFacts are copied into the new atelier (FR-007)
    AtelierSummary:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        playerCount:
          type: integer
        hasProjectFacts:
          type: boolean
          description: true when the atelier has at least one persisted ProjectFact (spec 007)
    ProjectFact:
      type: object
      required: [text, author, turnIndex, timestamp]
      properties:
        text:
          type: string
          minLength: 1
        author:
          type: string
        turnIndex:
          type: integer
        timestamp:
          type: string
          format: date-time
    VoteDecision:
      type: object
      required: [voter, vote, explanationCheck, applicabilityCheck, justification]
      properties:
        voter:
          type: string
        vote:
          type: string
          enum: [YES, NO]
        explanationCheck:
          type: string
          enum: [OK, INSUFFICIENT]
        applicabilityCheck:
          type: string
          enum: [OK, NOT_APPLICABLE]
        justification:
          type: string
    Atelier:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        featureHtml:
          type: string
        playerCount:
          type: integer
        players:
          type: array
          items:
            type: object
        deck:
          type: array
          items:
            type: object
        legs:
          type: array
          items:
            $ref: '#/components/schemas/Leg'
        tours:
          type: array
          items:
            type: object
        scores:
          type: object
          additionalProperties:
            type: integer
        winner:
          type: array
          items:
            type: string
        projectFacts:
          type: array
          description: Shared project memory of this atelier (spec 007, FR-005/FR-007); empty for legacy ateliers
          items:
            $ref: '#/components/schemas/ProjectFact'
    Leg:
      type: object
      description: See leg-schema.json v4.0.0 for the full schema
      properties:
        cardName:
          type: string
        scenario:
          type: string
        explanation:
          type: string
        entries:
          type: array
          items:
            type: object
        validation:
          type: string
          enum: [PENDING, VALIDATED, REJECTED]
        turnIndex:
          type: integer
        majorSuit:
          type: string
        points:
          type: integer
        votes:
          type: array
          description: Per-voter structured decisions (spec 007, FR-010); empty for legacy legs
          items:
            $ref: '#/components/schemas/VoteDecision'
    Error:
      type: object
      properties:
        message:
          type: string
