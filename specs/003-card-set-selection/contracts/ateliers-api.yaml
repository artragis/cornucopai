# API contract for ateliers — UPDATED by feature 003-card-set-selection
# (supersedes specs/002-cornucopia-game-flow/contracts/ateliers-api.yaml v0.2.0)
# Changes: POST body gains `language` (default "fr") and `families` (list of
# "setId:familyId"); Atelier gains `language`, `selectedFamilies`, `sets` and its
# `deck` becomes an array of Card objects (real cards, R-016/R-017/R-018).
# Backend: Quarkus REST under /api/ateliers. The game still runs synchronously on POST.
openapi: 3.0.3
info:
  title: CornucopAI Ateliers API
  version: 0.3.0
  description: >
    Create and run a Cornucopia threat-modeling workshop played by AI agents, using
    the real Cornucopia cards of the selected families (FR-005..FR-010).
paths:
  /api/ateliers:
    post:
      summary: Configure and launch a game with selected card families (FR-005, FR-006)
      operationId: createAtelier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAtelierRequest'
            example:
              playerCount: 4
              featureHtml: "<p>Analyse de la feature <b>login OAuth2</b></p>"
              language: fr
              families: ["webapp:VE", "webapp:AT", "eop:SP"]
      responses:
        '201':
          description: Atelier created and game fully played; legs persisted on disk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Atelier'
        '400':
          description: >
            Invalid request — playerCount < 2, empty featureHtml, empty families
            (FR-006), unknown setId:familyId (FR-012), or Cornucopia repo not
            configured (FR-011)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: List all ateliers (id, createdAt, playerCount)
      operationId: listAteliers
      responses:
        '200':
          description: List of atelier summaries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AtelierSummary'
  /api/ateliers/{id}:
    get:
      summary: Full atelier detail including every leg with its validation status
      operationId: getAtelier
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          example: atelier2026-11-08-091500
      responses:
        '200':
          description: Atelier detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Atelier'
        '404':
          description: Unknown atelier id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    CreateAtelierRequest:
      type: object
      required: [playerCount, featureHtml, families]
      properties:
        playerCount:
          type: integer
          minimum: 2
          example: 4
        featureHtml:
          type: string
          minLength: 1
          example: "<p>Analyse de la feature <b>login OAuth2</b></p>"
        language:
          type: string
          default: fr
          description: Chosen language, lowercase; defaults to French (FR-015). Falls back per set to "en" (R-015).
          example: fr
        families:
          type: array
          minItems: 1
          description: Selected families as "setId:familyId" pairs (FR-005). At least one required (FR-006).
          items: { type: string }
          example: ["webapp:VE", "eop:SP"]
    Card:
      type: object
      required: [id, value, setId, suitId, suitName, language, description]
      properties:
        id: { type: string, example: VE2 }
        value: { type: string, example: "2" }
        setId: { type: string, example: webapp }
        suitId: { type: string, example: VE }
        suitName: { type: string, example: "DATA VALIDATION & ENCODING" }
        language: { type: string, description: Resolved language of this card, example: fr }
        description: { type: string, example: "Robert can input malicious data because the allowed protocol format is not being checked…" }
        url: { type: string, nullable: true }
        misc: { type: string, nullable: true }
    SetResolution:
      type: object
      required: [id, resolvedLanguage]
      properties:
        id: { type: string, example: webapp }
        resolvedLanguage:
          type: string
          description: Language actually used for this set (chosen language, or "en" fallback) — FR-017
          example: fr
    Archetype:
      type: string
      enum: [GRUMPY, HAPPY, GREEDY, PROF]
    ValidationStatus:
      type: string
      enum: [PENDING, VALIDATED, REJECTED]
    Participant:
      type: object
      required: [name, archetype]
      properties:
        name: { type: string, example: Joueur-1 }
        archetype: { $ref: '#/components/schemas/Archetype' }
    Leg:
      type: object
      description: The 5-field JSON persisted per played card (contracts/leg-schema.json). cardName is now a REAL card id (e.g. VE2) referencing a Card in atelier.json's deck.
      required: [cardName, scenario, explanation, precisions, validation]
      properties:
        cardName: { type: string, example: VE2 }
        scenario: { type: string, example: "Un attaquant injecte du HTML dans le champ commentaire" }
        explanation: { type: string }
        precisions:
          type: array
          items: { type: string }
        validation: { $ref: '#/components/schemas/ValidationStatus' }
    Atelier:
      type: object
      required: [id, createdAt, featureHtml, playerCount, players, turnOrder, language, selectedFamilies, deck, sets, legs]
      properties:
        id: { type: string, example: atelier2026-11-08-091500 }
        createdAt: { type: string, format: date-time }
        featureHtml: { type: string }
        playerCount: { type: integer }
        players:
          type: array
          items: { $ref: '#/components/schemas/Participant' }
        turnOrder:
          type: array
          items: { type: string }
        language: { type: string, example: fr }
        selectedFamilies:
          type: array
          items: { type: string }
          example: ["webapp:VE", "eop:SP"]
        deck:
          type: array
          description: Real dealt cards (full objects, id + description persisted here) — R-016
          items: { $ref: '#/components/schemas/Card' }
        sets:
          type: array
          description: Resolved language per set used in this game — FR-017
          items: { $ref: '#/components/schemas/SetResolution' }
        legs:
          type: array
          items: { $ref: '#/components/schemas/Leg' }
    AtelierSummary:
      type: object
      required: [id, createdAt, playerCount]
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        playerCount: { type: integer }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, example: "unknown family: eop:XX" }
